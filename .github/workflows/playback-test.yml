name: PobreMusic playback test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test real Audius stream
        run: |
          node <<'NODE'
          const api = 'https://api.audius.co/v1';
          const app = 'PobreMusic';
          const search = await fetch(api + '/tracks/search?query=electronic&limit=10&sort_method=relevant&app_name=' + app);
          if (!search.ok) throw new Error('Audius search HTTP ' + search.status);
          const data = await search.json();
          const track = (data.data || []).find(t => t?.id && (t.duration || 0) > 40);
          if (!track) throw new Error('Audius returned no playable track');
          const stream = await fetch(api + '/tracks/' + encodeURIComponent(track.id) + '/stream?app_name=' + app, { redirect: 'follow' });
          if (!stream.ok) throw new Error('Audius stream HTTP ' + stream.status);
          const type = stream.headers.get('content-type') || '';
          if (!type.startsWith('audio/')) throw new Error('Stream is not audio: ' + type);
          console.log('PASS:', track.title, '-', track.user?.name, '|', type);
          NODE
